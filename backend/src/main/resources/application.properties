server.port=${PORT:5001}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rq_blog}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
ai.base-url=${AI_BASE_URL:http://localhost:11434}
ai.model=${AI_MODEL:qwen2.5:3b}
